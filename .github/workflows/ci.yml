name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    # The org's 16-core runner; pull requests from forks run on GitHub's own
    # runners instead, so outside code never runs on ours.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || 'jog-16vcpu' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      # The fake server validates against schema/; this keeps schema/ honest.
      - run: ci/schema-check.sh
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
